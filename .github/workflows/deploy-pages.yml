name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build static export
        run: npm run build
        working-directory: frontend
        env:
          # Static export for GitHub Pages hosting. The custom domain is
          # configured in the repository's Pages settings
          # (brandprotection.segbytes.xyz) and mirrored in public/CNAME.
          NEXUSEMAIL_STATIC_EXPORT: "1"
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.brandprotection.segbytes.xyz/api' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN || '' }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT || 'production' }}
      - name: Configure pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          static_site_generator: next
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

version: '3.8'

services:
  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  # PostgreSQL (shared data layer)
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=nexusemail
      - POSTGRES_PASSWORD=nexusemail
      - POSTGRES_DB=nexusemail
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusemail"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Backend (Express API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgres://nexusemail:nexusemail@postgres:5432/nexusemail
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - CRON_SECRET=${CRON_SECRET:-dev-cron-secret}
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

volumes:
  pgdata:

networks:
  default:
    name: nexusemail-network